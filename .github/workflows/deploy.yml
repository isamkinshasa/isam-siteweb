name: Deploy to LWS via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install
        
      - name: Build Next.js app
        run: npm run build
        
      - name: Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftp.isamkinshasa.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /
          
          # IMPORTANT: 
          # 1. Si vous utilisez un export statique (avec `output: 'export'` dans next.config.mjs),
          #    décommentez la ligne ci-dessous pour ne transférer que le dossier "out".
          # local-dir: ./out/
          
          # 2. Si vous déployez sur un serveur Node.js, l'action transférera
          #    les fichiers nécessaires pour exécuter Next.js (sauf node_modules)
          
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
